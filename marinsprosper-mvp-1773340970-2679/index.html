<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Marinsprosper — Câmbio P2P, simples e seguro</title>
  <style>
    :root{
      --bg:#0b0b10; --card:#12121a; --muted:#a8a8b3; --text:#f4f4f8;
      --pink:#ff3ea5; --pink2:#ff6cc0; --line:#242432; --ok:#2dd4bf; --warn:#fbbf24; --bad:#fb7185;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --r: 18px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);
      background:radial-gradient(1200px 700px at 20% 10%, rgba(255,62,165,.22), transparent 55%),
               radial-gradient(900px 600px at 90% 20%, rgba(45,212,191,.16), transparent 55%), var(--bg);
      color:var(--text)}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1180px;margin:0 auto;padding:22px}
    .topbar{position:sticky;top:0;z-index:9;background:rgba(11,11,16,.78);backdrop-filter: blur(10px);border-bottom:1px solid var(--line)}
    .topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}
    .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pink),#7c3aed);box-shadow:var(--shadow)}
    .nav{display:flex;gap:12px;flex-wrap:wrap}
    .pill{padding:10px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(18,18,26,.7);cursor:pointer}
    .pill:hover{border-color:rgba(255,62,165,.6)}
    .cta{padding:10px 14px;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#140012;font-weight:800;cursor:pointer}
    .hero{padding:34px 0 18px}
    .grid{display:grid;gap:16px}
    .heroGrid{grid-template-columns: 1.25fr .75fr}
    @media(max-width:980px){.heroGrid{grid-template-columns:1fr}}
    .card{background:rgba(18,18,26,.85);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
    .card .in{padding:18px}
    h1{margin:0 0 10px;font-size:42px;line-height:1.05}
    @media(max-width:520px){h1{font-size:34px}}
    .sub{color:var(--muted);font-size:16px;line-height:1.5;margin:0 0 18px}
    .kpi{display:flex;gap:10px;flex-wrap:wrap}
    .kpi .chip{padding:8px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(0,0,0,.18)}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .btn{cursor:pointer;border:0}
    .btn2{padding:11px 14px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);color:var(--text);cursor:pointer}
    .btn2:hover{border-color:rgba(45,212,191,.45)}
    .sectionTitle{font-size:18px;margin:0 0 10px}
    .muted{color:var(--muted)}
    .list{display:grid;gap:10px}
    .item{padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.16)}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
    .dot{width:8px;height:8px;border-radius:999px;background:var(--ok)}
    .dot.warn{background:var(--warn)}
    .dot.bad{background:var(--bad)}
    .appShell{display:grid;grid-template-columns:260px 1fr;gap:14px}
    @media(max-width:980px){.appShell{grid-template-columns:1fr}}
    .side{padding:14px}
    .side h3{margin:0 0 10px}
    .menu{display:grid;gap:8px}
    .menu button{width:100%;text-align:left}
    .main{padding:14px}
    .table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;color:var(--muted)}
    .table th{color:var(--text);background:rgba(0,0,0,.22)}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:980px){.two{grid-template-columns:1fr}}
    .field{display:grid;gap:6px}
    input,select,textarea{
      width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);
      background:rgba(0,0,0,.18);color:var(--text);outline:none
    }
    textarea{min-height:90px;resize:vertical}
    .footer{padding:22px 0 40px;color:var(--muted);font-size:13px}
    .hr{height:1px;background:var(--line);margin:16px 0}
    .tiny{font-size:12px;color:var(--muted)}
    .right{display:flex;justify-content:flex-end}
    .danger{border-color:rgba(251,113,133,.55)!important}
    .ok{border-color:rgba(45,212,191,.55)!important}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wrap">
      <div class="brand">
        <div class="logo"></div>
        <div>Marinsprosper</div>
      </div>
      <div class="nav">
        <a class="pill" href="#/">Home</a>
        <a class="pill" href="#/app">MVP</a>
        <a class="pill" href="#/docs">Spec</a>
        <a class="cta" href="#/login">Entrar</a>
      </div>
    </div>
  </div>

  <div id="root"></div>

  <div class="wrap footer">
    <div class="hr"></div>
    <div class="row" style="justify-content:space-between">
      <div>© <span id="year"></span> Marinsprosper — “Câmbio P2P, simples e seguro.”</div>
      <div class="tiny">MVP offline (localStorage). Fluxo testável ponta-a-ponta.</div>
    </div>
  </div>

<script>
  const KEY_DB="mp_db_v1";
  const KEY_SESS="mp_sess_v1";
  const elRoot = document.getElementById("root");
  document.getElementById("year").textContent = new Date().getFullYear();

  function uid(prefix="u"){ return prefix+"_"+Math.random().toString(16).slice(2)+Date.now().toString(16).slice(2); }
  function now(){ return new Date().toISOString(); }
  function money(n){ return (Number(n)||0).toFixed(2); }
  function mount(html){ elRoot.innerHTML = html; }

  const STATUS = {
    created:"created",
    accepted:"accepted",
    paid:"paid_by_first_party",
    completed:"completed",
    cancel_requested:"cancel_requested",
    dispute:"dispute",
    resolved:"resolved",
  };

  function seedDB(){
    return {
      users: [
        {id:"u_admin", email:"admin@marinsprosper.local", role:"admin", status:"approved", ratingAvg:5, ratingCount:1},
        {id:"u_cashier", email:"cashier@marinsprosper.local", role:"cashier", status:"approved", ratingAvg:4.9, ratingCount:42, collateralUsd:100, exposureActive:0},
        {id:"u_client", email:"client@marinsprosper.local", role:"client", status:"approved", ratingAvg:4.8, ratingCount:12},
      ],
      config: { platformPct:0.5, clientPaysCashierPct:3.0, clientReceivesPct:2.5, collateralFactor:0.5 },
      orders: [],
      chat: [],
      ratings: [],
      audit: [{at:now(), action:"seed_created", meta:{}}],
      blacklist: []
    };
  }

  function loadDB(){
    try{
      const raw=localStorage.getItem(KEY_DB);
      if(!raw) { const s=seedDB(); localStorage.setItem(KEY_DB, JSON.stringify(s)); return s; }
      return JSON.parse(raw);
    }catch(e){
      const s=seedDB(); localStorage.setItem(KEY_DB, JSON.stringify(s)); return s;
    }
  }
  function saveDB(){ localStorage.setItem(KEY_DB, JSON.stringify(db)); }
  function audit(action, meta){ db.audit.unshift({at:now(), action, meta}); saveDB(); }

  function loadSess(){ try{ return JSON.parse(localStorage.getItem(KEY_SESS)||"null"); }catch(e){ return null; } }
  function saveSess(s){ localStorage.setItem(KEY_SESS, JSON.stringify(s)); }
  function clearSess(){ localStorage.removeItem(KEY_SESS); }

  let db = loadDB();
  let sess = loadSess();

  function me(){ return sess ? db.users.find(u=>u.id===sess.userId) : null; }

  function calcCashierLimit(cashier){
    const factor = Number(db.config.collateralFactor||0);
    const total = Number(cashier.collateralUsd||0);
    const active = Number(cashier.exposureActive||0);
    return Math.max(0, (total*factor) - active);
  }

  function requireAuth(){
    if(!me()) { location.hash="#/login"; return false; }
    return true;
  }

  function home(){
    return `
    <div class="wrap hero">
      <div class="grid heroGrid">
        <div class="card"><div class="in">
          <h1>Câmbio P2P, simples e seguro.</h1>
          <p class="sub">MVP navegável tipo app: crie conta, faça login e teste o fluxo completo (cliente ↔ caixeiro ↔ admin), com caução, chat e disputa.</p>
          <div class="row">
            <a class="cta" href="#/register">Criar conta</a>
            <a class="btn2" href="#/login">Entrar</a>
            <a class="btn2" href="#/app">Abrir MVP</a>
          </div>
          <div class="hr"></div>
          <div class="kpi">
            <span class="chip">Cliente envia primeiro</span>
            <span class="chip">Caixeiro limitado por caução</span>
            <span class="chip">Chat por ordem</span>
            <span class="chip">Cancelamento com aceite</span>
            <span class="chip">Disputa com admin</span>
            <span class="chip">Auditoria</span>
          </div>
        </div></div>
        <div class="card"><div class="in">
          <div class="badge"><span class="dot"></span><b>Contas seed (para testar agora)</b></div>
          <div class="list" style="margin-top:10px">
            <div class="item"><b>Admin</b><div class="tiny">admin@marinsprosper.local</div><div class="tiny">senha: <b>admin</b></div></div>
            <div class="item"><b>Caixeiro</b><div class="tiny">cashier@marinsprosper.local</div><div class="tiny">senha: <b>cashier</b></div></div>
            <div class="item"><b>Cliente</b><div class="tiny">client@marinsprosper.local</div><div class="tiny">senha: <b>client</b></div></div>
          </div>
          <div class="hr"></div>
          <div class="tiny">Dica: crie um usuário “pending” no /register e aprove no /admin.</div>
        </div></div>
      </div>
    </div>`;
  }

  function docs(){
    return `
    <div class="wrap hero">
      <div class="card"><div class="in">
        <h2 class="sectionTitle">Spec / PRD (arquivo)</h2>
        <p class="sub">O texto completo está publicado junto do site como <b>SPEC.md</b>.</p>
        <div class="row">
          <span class="badge"><span class="dot"></span> estados: created → accepted → paid → completed</span>
          <span class="badge"><span class="dot warn"></span> cancel_requested → resolved/dispute</span>
        </div>
        <div class="hr"></div>
        <div class="row">
          <a class="cta" href="#/app">Abrir MVP</a>
          <a class="btn2" href="#/login">Login</a>
          <a class="btn2" href="#/register">Register</a>
        </div>
      </div></div>
    </div>`;
  }

  function loginView(){
    return `
    <div class="wrap hero">
      <div class="card"><div class="in">
        <h2 class="sectionTitle">Login</h2>
        <p class="sub">Entre para acessar o MVP. (mock) — senhas seed: admin/cashier/client</p>
        <div class="two">
          <div class="field"><label class="muted">Email</label><input id="email" placeholder="email"/></div>
          <div class="field"><label class="muted">Senha</label><input id="pass" type="password" placeholder="senha"/></div>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="cta btn" id="doLogin">Entrar</button>
          <a class="btn2" href="#/register">Criar conta</a>
          <button class="btn2 danger" id="resetDb">Resetar dados (local)</button>
        </div>
        <div class="hr"></div>
        <div id="msg" class="tiny"></div>
      </div></div>
    </div>`;
  }

  function registerView(){
    return `
    <div class="wrap hero">
      <div class="card"><div class="in">
        <h2 class="sectionTitle">Criar conta</h2>
        <p class="sub">No MVP: conta nasce como <b>pending</b> e o Admin aprova.</p>
        <div class="two">
          <div class="field"><label class="muted">Email</label><input id="email" placeholder="seu@email.com"/></div>
          <div class="field"><label class="muted">Senha</label><input id="pass" type="password" placeholder="senha"/></div>
        </div>
        <div class="two" style="margin-top:10px">
          <div class="field"><label class="muted">Tipo</label>
            <select id="role">
              <option value="client">Cliente</option>
              <option value="cashier">Caixeiro</option>
            </select>
          </div>
          <div class="field"><label class="muted">Obs (opcional)</label><input id="note" placeholder="ex: PIX / Wise / região"/></div>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="cta btn" id="doReg">Criar</button>
          <a class="btn2" href="#/login">Voltar</a>
        </div>
        <div class="hr"></div>
        <div id="msg" class="tiny"></div>
      </div></div>
    </div>`;
  }

  function appShell(innerHtml){
    const u = me();
    const who = u ? `${u.email} (${u.role}/${u.status})` : "deslogado";
    return `
    <div class="wrap hero">
      <div class="grid appShell">
        <div class="card"><div class="side">
          <h3 style="margin:0 0 6px">Marinsprosper MVP</h3>
          <div class="tiny">${who}</div>
          <div class="hr"></div>
          <div class="menu">
            <button class="btn2" data-go="#/client">Cliente</button>
            <button class="btn2" data-go="#/cashier">Caixeiro</button>
            <button class="btn2" data-go="#/admin">Admin</button>
            <button class="btn2" data-go="#/orders">Ordens</button>
          </div>
          <div class="hr"></div>
          <div class="badge"><span class="dot"></span><b>Config</b></div>
          <div class="tiny" style="margin-top:8px">
            platformPct: <b>${db.config.platformPct}%</b><br/>
            clientPaysCashierPct: <b>${db.config.clientPaysCashierPct}%</b><br/>
            clientReceivesPct: <b>${db.config.clientReceivesPct}%</b><br/>
            collateralFactor: <b>${db.config.collateralFactor}</b>
          </div>
          <div class="hr"></div>
          <div class="row">
            ${u ? `<button class="btn2" id="logout">Sair</button>` : `<a class="btn2" href="#/login">Login</a>`}
            <a class="btn2" href="#/">Home</a>
          </div>
        </div></div>
        <div class="card"><div class="main" id="appView">${innerHtml||""}</div></div>
      </div>
    </div>`;
  }

  function ordersTable(rows, mode){
    if(!rows.length) return `<div class="tiny">Nenhuma ordem.</div>`;
    return `
      <table class="table">
        <thead><tr><th>ID</th><th>Status</th><th>Lado</th><th>Valor</th><th>Ação</th></tr></thead>
        <tbody>
          ${rows.map(o=>`
            <tr>
              <td>${o.id}</td>
              <td>${o.status}</td>
              <td>${o.side}</td>
              <td>$${money(o.amountUsd)}</td>
              <td>
                ${mode==="available"
                  ? `<button class="btn2" data-accept="${o.id}">Aceitar</button>`
                  : `<a class="btn2" href="#/order/${o.id}">Abrir</a>`
                }
              </td>
            </tr>`).join("")}
        </tbody>
      </table>`;
  }

  function clientView(){
    const u=me();
    if(!u) return `<div class="badge"><span class="dot warn"></span> Faça login.</div>`;
    if(u.role!=="client") return `<div class="badge"><span class="dot warn"></span> Esta área é para <b>cliente</b>.</div>`;
    if(u.status!=="approved") return `<div class="badge"><span class="dot warn"></span> Sua conta está <b>${u.status}</b>. Aguarde admin aprovar.</div>`;
    const rows = db.orders.filter(o=>o.clientId===u.id);
    return `
      <h2 class="sectionTitle">Cliente</h2>
      <div class="two">
        <div class="card"><div class="in">
          <div class="badge"><span class="dot"></span><b>Criar ordem</b></div>
          <div class="two" style="margin-top:10px">
            <div class="field"><label class="muted">Lado</label>
              <select id="side"><option value="buy">Compra USDT</option><option value="sell">Venda USDT</option></select>
            </div>
            <div class="field"><label class="muted">Valor (USD)</label>
              <input id="amount" type="number" min="5" step="1" value="50"/>
            </div>
          </div>
          <div class="two" style="margin-top:10px">
            <div class="field"><label class="muted">Rede</label>
              <select id="network"><option>TRC20</option><option>ERC20</option><option>BEP20</option></select>
            </div>
            <div class="field"><label class="muted">Método</label>
              <select id="pm"><option>PIX</option><option>Wise</option><option>Transferência</option></select>
            </div>
          </div>
          <div class="right" style="margin-top:10px">
            <button class="cta btn" id="createOrder">Criar</button>
          </div>
          <div class="tiny">Dica: após aceitar, você precisa “Marcar como pago/enviado”.</div>
        </div></div>

        <div class="card"><div class="in">
          <div class="badge"><span class="dot"></span><b>Minhas ordens</b></div>
          <div style="margin-top:10px;overflow:auto">
            ${ordersTable(rows, "mine")}
          </div>
        </div></div>
      </div>`;
  }

  function cashierView(){
    const u=me();
    if(!u) return `<div class="badge"><span class="dot warn"></span> Faça login.</div>`;
    if(u.role!=="cashier") return `<div class="badge"><span class="dot warn"></span> Esta área é para <b>caixeiro</b>.</div>`;
    if(u.status!=="approved") return `<div class="badge"><span class="dot warn"></span> Sua conta está <b>${u.status}</b>. Aguarde admin aprovar.</div>`;
    const limit = calcCashierLimit(u);
    const available = db.orders.filter(o=>o.status===STATUS.created);
    const mine = db.orders.filter(o=>o.cashierId===u.id);
    return `
      <h2 class="sectionTitle">Caixeiro</h2>
      <div class="two">
        <div class="card"><div class="in">
          <div class="badge"><span class="dot"></span><b>Caução & Limite</b></div>
          <div class="list" style="margin-top:10px">
            <div class="item"><b>Caução</b><div class="muted">$${money(u.collateralUsd||0)}</div></div>
            <div class="item"><b>Exposição ativa</b><div class="muted">$${money(u.exposureActive||0)}</div></div>
            <div class="item"><b>Limite disponível</b><div class="muted">$${money(limit)}</div></div>
          </div>
          <div class="tiny" style="margin-top:8px">limite = caução * fator − exposição ativa</div>
        </div></div>

        <div class="card"><div class="in">
          <div class="badge"><span class="dot"></span><b>Ordens disponíveis</b></div>
          <div style="margin-top:10px;overflow:auto">
            ${ordersTable(available, "available")}
          </div>
        </div></div>
      </div>

      <div class="card" style="margin-top:12px"><div class="in">
        <div class="badge"><span class="dot"></span><b>Minhas ordens</b></div>
        <div style="margin-top:10px;overflow:auto">
          ${ordersTable(mine, "mine")}
        </div>
      </div></div>`;
  }

  function adminView(){
    const u=me();
    if(!u) return `<div class="badge"><span class="dot warn"></span> Faça login.</div>`;
    if(u.role!=="admin") return `<div class="badge"><span class="dot warn"></span> Esta área é para <b>admin</b>.</div>`;

    const pending = db.users.filter(x=>x.status==="pending");
    const approved = db.users.filter(x=>x.status==="approved" && x.role!=="admin");
    return `
      <h2 class="sectionTitle">Admin</h2>
      <div class="two">
        <div class="card"><div class="in">
          <div class="badge"><span class="dot"></span><b>Config (parametrizado)</b></div>
          <div class="two" style="margin-top:10px">
            <div class="field"><label class="muted">platformPct (%)</label><input id="platformPct" type="number" step="0.1" value="${db.config.platformPct}"></div>
            <div class="field"><label class="muted">collateralFactor</label><input id="collateralFactor" type="number" step="0.05" value="${db.config.collateralFactor}"></div>
          </div>
          <div class="two" style="margin-top:10px">
            <div class="field"><label class="muted">clientPaysCashierPct (%)</label><input id="clientPaysCashierPct" type="number" step="0.1" value="${db.config.clientPaysCashierPct}"></div>
            <div class="field"><label class="muted">clientReceivesPct (%)</label><input id="clientReceivesPct" type="number" step="0.1" value="${db.config.clientReceivesPct}"></div>
          </div>
          <div class="right" style="margin-top:10px"><button class="cta btn" id="saveCfg">Salvar</button></div>
        </div></div>

        <div class="card"><div class="in">
          <div class="badge"><span class="dot"></span><b>Aprovação</b></div>
          <div class="tiny" style="margin-top:10px"><b>Pending:</b> ${pending.length}</div>
          <div style="margin-top:10px;overflow:auto;max-height:220px">
            <table class="table">
              <thead><tr><th>Email</th><th>Role</th><th>Ação</th></tr></thead>
              <tbody>
                ${pending.map(p=>`
                  <tr>
                    <td>${p.email}</td><td>${p.role}</td>
                    <td>
                      <button class="btn2 ok" data-approve="${p.id}">Aprovar</button>
                      <button class="btn2 danger" data-block="${p.id}">Bloquear</button>
                    </td>
                  </tr>`).join("") || `<tr><td colspan="3">Sem pendências</td></tr>`}
              </tbody>
            </table>
          </div>

          <div class="hr"></div>
          <div class="tiny"><b>Aprovados:</b> ${approved.length}</div>
        </div></div>
      </div>

      <div class="card" style="margin-top:12px"><div class="in">
        <div class="badge"><span class="dot"></span><b>Auditoria</b></div>
        <div style="margin-top:10px;overflow:auto;max-height:260px">
          <table class="table">
            <thead><tr><th>At</th><th>Ação</th></tr></thead>
            <tbody>
              ${db.audit.slice(0,80).map(a=>`<tr><td>${a.at}</td><td>${a.action}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div></div>`;
  }

  function ordersView(){
    const u=me();
    if(!u) return `<div class="badge"><span class="dot warn"></span> Faça login.</div>`;
    const rows = (u.role==="admin")
      ? db.orders
      : (u.role==="client")
        ? db.orders.filter(o=>o.clientId===u.id)
        : db.orders.filter(o=>o.cashierId===u.id || o.status===STATUS.created);

    return `
      <h2 class="sectionTitle">Ordens</h2>
      <div class="tiny">Clique para abrir e testar chat, prova/TXID, cancelamento e disputa.</div>
      <div style="margin-top:10px;overflow:auto">
        ${ordersTable(rows, "mine")}
      </div>`;
  }

  function orderView(id){
    const u=me();
    if(!u) return `<div class="badge"><span class="dot warn"></span> Faça login.</div>`;

    const o = db.orders.find(x=>x.id===id);
    if(!o) return `<div class="badge"><span class="dot bad"></span><b>Ordem não encontrada</b></div>`;

    const isClient = (u.id===o.clientId);
    const isCashier = (u.id===o.cashierId);
    const isAdmin = (u.role==="admin");

    if(!isAdmin && !isClient && !isCashier) return `<div class="badge"><span class="dot bad"></span> Sem permissão</div>`;

    const canClientPay = isClient && o.status===STATUS.accepted;
    const canCashierComplete = isCashier && o.status===STATUS.paid;
    const canReqCancel = (isClient||isCashier) && (o.status!==STATUS.completed && o.status!==STATUS.resolved);
    const cancelPending = o.status===STATUS.cancel_requested;
    const canAcceptCancel = cancelPending && (isClient||isCashier);
    const canRefuseCancel = cancelPending && (isClient||isCashier);

    const canRate = o.status===STATUS.completed && !db.ratings.find(r=>r.orderId===o.id && r.fromUserId===u.id);

    return `
      <h2 class="sectionTitle">Ordem ${o.id}</h2>
      <div class="row">
        <span class="badge"><span class="dot"></span><b>Status:</b> ${o.status}</span>
        <span class="badge"><span class="dot"></span><b>Lado:</b> ${o.side}</span>
        <span class="badge"><span class="dot"></span><b>Valor:</b> $${money(o.amountUsd)}</span>
        <span class="badge"><span class="dot"></span><b>Rede:</b> ${o.network}</span>
        <span class="badge"><span class="dot"></span><b>Método:</b> ${o.paymentMethod}</span>
      </div>

      <div class="two" style="margin-top:12px">
        <div class="card"><div class="in">
          <div class="badge"><span class="dot"></span><b>Ações</b></div>

          <div class="field" style="margin-top:10px">
            <label class="muted">Comprovante / TXID</label>
            <textarea id="proof">${o.proofText||""}</textarea>
            <div class="right" style="margin-top:8px"><button class="btn2" id="saveProof">Salvar</button></div>
          </div>

          <div class="row" style="margin-top:10px">
            <button class="cta btn" id="markPaid" ${canClientPay?"":"disabled"}>Cliente: marcar pago/enviado</button>
            <button class="cta btn" id="complete" ${canCashierComplete?"":"disabled"}>Caixeiro: concluir</button>
          </div>

          <div class="hr"></div>
          <div class="badge"><span class="dot warn"></span><b>Cancelamento</b></div>
          <div class="row" style="margin-top:10px">
            <button class="btn2" id="reqCancel" ${canReqCancel?"":"disabled"}>Solicitar</button>
            <button class="btn2 ok" id="acceptCancel" ${canAcceptCancel?"":"disabled"}>Aceitar</button>
            <button class="btn2 danger" id="refuseCancel" ${canRefuseCancel?"":"disabled"}>Recusar → disputa</button>
          </div>

          <div class="hr"></div>
          <div class="badge"><span class="dot"></span><b>Chat</b></div>
          <div id="chatBox" style="margin-top:10px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(0,0,0,.14)"></div>
          <div class="row" style="margin-top:10px">
            <input id="msg" placeholder="Mensagem..."/>
            <button class="cta btn" id="sendMsg">Enviar</button>
          </div>

          <div class="hr"></div>
          <div class="badge"><span class="dot"></span><b>Avaliação</b></div>
          <div class="row" style="margin-top:10px">
            <select id="stars" ${canRate?"":"disabled"}>
              <option value="5">5 ⭐</option><option value="4">4 ⭐</option><option value="3">3 ⭐</option><option value="2">2 ⭐</option><option value="1">1 ⭐</option>
            </select>
            <button class="btn2" id="rate" ${canRate?"":"disabled"}>Avaliar</button>
            <span class="tiny">${canRate ? "1 avaliação por ordem." : "Indisponível (já avaliou ou não concluiu)."}</span>
          </div>
        </div></div>

        <div class="card"><div class="in">
          <div class="badge"><span class="dot"></span><b>Admin / Regras</b></div>
          <div class="tiny" style="margin-top:10px">
            • Cliente envia primeiro (botão “marcar pago”).<br/>
            • Caixeiro só conclui após pago.<br/>
            • Cancelamento exige aceite; recusa vira disputa.<br/>
            • Admin vê tudo e aprova contas.<br/>
          </div>
          <div class="hr"></div>
          <a class="btn2" href="#/orders">Voltar</a>
        </div></div>
      </div>`;
  }

  function render(){
    const h = location.hash || "#/";
    const u = me();

    if(h==="#/" || h==="#"){ mount(home()); return; }
    if(h==="#/docs"){ mount(docs()); return; }

    if(h==="#/login"){
      mount(loginView());
      document.getElementById("doLogin").onclick=()=>{
        const email=document.getElementById("email").value.trim().toLowerCase();
        const pass=document.getElementById("pass").value.trim();
        const msg=document.getElementById("msg");
        msg.textContent="";

        // seed passwords (mock)
        const seedPass = (email==="admin@marinsprosper.local") ? "admin"
                      : (email==="cashier@marinsprosper.local") ? "cashier"
                      : (email==="client@marinsprosper.local") ? "client"
                      : null;

        const user = db.users.find(x=>x.email===email);
        if(!user){ msg.textContent="Usuário não encontrado."; return; }
        if(user.status==="blocked"){ msg.textContent="Usuário bloqueado."; return; }
        if(user.status==="pending"){ msg.textContent="Usuário pendente. Admin precisa aprovar."; return; }
        if(seedPass && pass!==seedPass){ msg.textContent="Senha inválida."; return; }
        if(!seedPass && pass.length<3){ msg.textContent="Senha inválida."; return; } // mock simples

        sess={userId:user.id}; saveSess(sess);
        audit("login",{user:user.email});
        location.hash="#/app";
      };

      document.getElementById("resetDb").onclick=()=>{
        if(confirm("Resetar tudo do MVP (localStorage)?")){
          localStorage.removeItem(KEY_DB);
          localStorage.removeItem(KEY_SESS);
          db=loadDB(); sess=loadSess();
          location.hash="#/login";
        }
      };
      return;
    }

    if(h==="#/register"){
      mount(registerView());
      document.getElementById("doReg").onclick=()=>{
        const email=document.getElementById("email").value.trim().toLowerCase();
        const pass=document.getElementById("pass").value.trim();
        const role=document.getElementById("role").value;
        const note=document.getElementById("note").value.trim();
        const msg=document.getElementById("msg");
        msg.textContent="";

        if(!email.includes("@")){ msg.textContent="Email inválido."; return; }
        if(pass.length<3){ msg.textContent="Senha muito curta (mock)."; return; }
        if(db.users.find(x=>x.email===email)){ msg.textContent="Email já cadastrado."; return; }

        const u={id:uid("u"), email, role, status:"pending", ratingAvg:0, ratingCount:0, note};
        if(role==="cashier"){ u.collateralUsd=0; u.exposureActive=0; }
        db.users.push(u);
        saveDB();
        audit("register_pending",{email, role});
        msg.textContent="Conta criada como PENDING. Peça ao admin para aprovar.";
      };
      return;
    }

    // MVP shell
    if(h.startsWith("#/app") || h==="#/client" || h==="#/cashier" || h==="#/admin" || h==="#/orders" || h.startsWith("#/order/")){
      // exige login para tudo dentro do app (exceto /app só mostra shell)
      if(!u){ location.hash="#/login"; return; }

      let inner = `<div class="badge"><span class="dot warn"></span> Escolha uma seção no menu.</div>`;

      if(h==="#/client") inner = clientView();
      else if(h==="#/cashier") inner = cashierView();
      else if(h==="#/admin") inner = adminView();
      else if(h==="#/orders") inner = ordersView();
      else if(h.startsWith("#/order/")) inner = orderView(h.split("/")[1]);

      mount(appShell(inner));

      // menu navegação
      document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>location.hash=b.dataset.go);

      // logout
      const lo=document.getElementById("logout");
      if(lo) lo.onclick=()=>{ audit("logout",{user:me()?.email}); clearSess(); sess=null; location.hash="#/login"; };

      // handlers por tela
      const cur = location.hash;

      if(cur==="#/client"){
        const btn=document.getElementById("createOrder");
        if(btn) btn.onclick=()=>{
          const u=me();
          const side=document.getElementById("side").value;
          const amount=Number(document.getElementById("amount").value||0);
          const network=document.getElementById("network").value;
          const pm=document.getElementById("pm").value;
          const id="O-"+String(Date.now()).slice(-7);

          const o={id, side, amountUsd:amount, network, paymentMethod:pm, clientId:u.id, cashierId:null,
                   status:STATUS.created, proofText:"", cancelRequestedBy:null};
          db.orders.unshift(o);
          saveDB();
          audit("order_created",{id, amount});
          location.hash="#/orders";
        };
      }

      if(cur==="#/cashier"){
        document.querySelectorAll("[data-accept]").forEach(b=>{
          b.onclick=()=>{
            const u=me();
            const o=db.orders.find(x=>x.id===b.dataset.accept);
            const limit=calcCashierLimit(u);
            if(Number(o.amountUsd)>limit){
              audit("cashier_accept_denied",{order:o.id, limit});
              alert("Limite insuficiente pela caução.");
              return;
            }
            o.cashierId=u.id;
            o.status=STATUS.accepted;
            u.exposureActive = Number(u.exposureActive||0) + Number(o.amountUsd||0);
            saveDB();
            audit("order_accepted",{order:o.id});
            location.hash="#/order/"+o.id;
          };
        });
      }

      if(cur==="#/admin"){
        const btn=document.getElementById("saveCfg");
        if(btn) btn.onclick=()=>{
          db.config.platformPct=Number(document.getElementById("platformPct").value);
          db.config.collateralFactor=Number(document.getElementById("collateralFactor").value);
          db.config.clientPaysCashierPct=Number(document.getElementById("clientPaysCashierPct").value);
          db.config.clientReceivesPct=Number(document.getElementById("clientReceivesPct").value);
          saveDB();
          audit("config_updated",{...db.config});
          location.hash="#/admin";
        };

        document.querySelectorAll("[data-approve]").forEach(b=>{
          b.onclick=()=>{
            const x=db.users.find(u=>u.id===b.dataset.approve);
            if(!x) return;
            x.status="approved";
            if(x.role==="cashier" && (x.collateralUsd==null)) { x.collateralUsd=100; x.exposureActive=0; } // mock: aprovar já dá caução
            saveDB();
            audit("user_approved",{email:x.email, role:x.role});
            location.hash="#/admin";
          };
        });

        document.querySelectorAll("[data-block]").forEach(b=>{
          b.onclick=()=>{
            const x=db.users.find(u=>u.id===b.dataset.block);
            if(!x) return;
            x.status="blocked";
            saveDB();
            audit("user_blocked",{email:x.email});
            location.hash="#/admin";
          };
        });
      }

      if(cur.startsWith("#/order/")){
        const id=cur.split("/")[1];
        const o=db.orders.find(x=>x.id===id);

        function renderChat(){
          const box=document.getElementById("chatBox");
          const msgs=db.chat.filter(m=>m.orderId===id).slice(-80);
          box.innerHTML = msgs.map(m=>`<div class="item"><div class="tiny"><b>${m.sender}</b> • ${m.at}</div>${m.text}</div>`).join("") || `<div class="tiny">Sem mensagens.</div>`;
          box.scrollTop = box.scrollHeight;
        }
        renderChat();

        document.getElementById("sendMsg").onclick=()=>{
          const text=document.getElementById("msg").value.trim();
          if(!text) return;
          const u=me();
          db.chat.push({orderId:id, at:now(), sender:u.role, text});
          saveDB();
          audit("chat_message",{order:id, by:u.role});
          document.getElementById("msg").value="";
          renderChat();
        };

        document.getElementById("saveProof").onclick=()=>{
          o.proofText=document.getElementById("proof").value;
          saveDB();
          audit("proof_saved",{order:id});
          alert("Prova/TXID salvo.");
        };

        const markPaid=document.getElementById("markPaid");
        if(markPaid) markPaid.onclick=()=>{
          if(o.status!==STATUS.accepted) return;
          o.status=STATUS.paid;
          saveDB();
          audit("client_marked_paid",{order:id});
          location.hash="#/order/"+id;
        };

        const complete=document.getElementById("complete");
        if(complete) complete.onclick=()=>{
          if(o.status!==STATUS.paid) return;
          o.status=STATUS.completed;
          // baixa exposição do caixeiro
          const cashier=db.users.find(u=>u.id===o.cashierId);
          if(cashier) cashier.exposureActive = Math.max(0, Number(cashier.exposureActive||0) - Number(o.amountUsd||0));
          saveDB();
          audit("order_completed",{order:id});
          location.hash="#/order/"+id;
        };

        const reqCancel=document.getElementById("reqCancel");
        if(reqCancel) reqCancel.onclick=()=>{
          if(o.status===STATUS.completed || o.status===STATUS.resolved) return;
          o.status=STATUS.cancel_requested;
          o.cancelRequestedBy=me().id;
          saveDB();
          audit("cancel_requested",{order:id});
          location.hash="#/order/"+id;
        };

        const acceptCancel=document.getElementById("acceptCancel");
        if(acceptCancel) acceptCancel.onclick=()=>{
          if(o.status!==STATUS.cancel_requested) return;
          o.status=STATUS.resolved;
          const cashier=db.users.find(u=>u.id===o.cashierId);
          if(cashier) cashier.exposureActive = Math.max(0, Number(cashier.exposureActive||0) - Number(o.amountUsd||0));
          saveDB();
          audit("cancel_accepted",{order:id});
          location.hash="#/order/"+id;
        };

        const refuseCancel=document.getElementById("refuseCancel");
        if(refuseCancel) refuseCancel.onclick=()=>{
          if(o.status!==STATUS.cancel_requested) return;
          o.status=STATUS.dispute;
          saveDB();
          audit("cancel_refused_to_dispute",{order:id});
          location.hash="#/order/"+id;
        };

        const rate=document.getElementById("rate");
        if(rate) rate.onclick=()=>{
          const u=me();
          if(o.status!==STATUS.completed) return;
          if(db.ratings.find(r=>r.orderId===o.id && r.fromUserId===u.id)) return;

          const stars=Number(document.getElementById("stars").value);
          let toUserId=null;
          if(u.id===o.clientId) toUserId=o.cashierId;
          else if(u.id===o.cashierId) toUserId=o.clientId;
          else return;

          db.ratings.push({id:uid("r"), orderId:o.id, fromUserId:u.id, toUserId, stars, at:now()});

          // recalcula média simples
          const target=db.users.find(x=>x.id===toUserId);
          if(target){
            const all=db.ratings.filter(r=>r.toUserId===toUserId).map(r=>r.stars);
            target.ratingCount=all.length;
            target.ratingAvg = all.reduce((a,b)=>a+b,0)/Math.max(1,all.length);
          }

          saveDB();
          audit("rated",{order:o.id, stars});
          location.hash="#/order/"+o.id;
        };
      }

      return;
    }

    mount(home());
  }

  window.addEventListener("hashchange", render);
  render();
</script>
</body>
</html>
